name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Toolchain
        run: |
          brew install cmake ninja meson pkgconf xcodegen

      - name: Fetch MoltenVK & Setup iOS SDK
        run: |
          git submodule update --init references/fbraz3-dxvk
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh

      - name: Build Generals for iOS
        run: |
          cmake --preset ios-vulkan
          cmake --build build/ios-vulkan --target z_generals

      - name: Package IPA
        run: |
          GX_TEAM_ID="DEVELOPER_TEAM" GX_BUNDLE_ID="com.generals.ios" \
          ./scripts/build/ios/package-ios-zh.sh
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generals-IPA
          path: build/ios-vulkan/**/*.ipa
