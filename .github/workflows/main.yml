name: Build iOS IPA
on: [push, workflow_dispatch]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VULKAN_SDK: /Users/runner/GeneralsX/MoltenVK/MoltenVK/MoltenVK

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Dependencies
        run: |
          brew install cmake xcodegen ninja meson
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh"

      - name: Build Project
        run: |
          git submodule update --init references/fbraz3-dxvk
          ./scripts/build/ios/fetch-moltenvk.sh
          ./scripts/build/ios/stage-fonts.sh
          
          # البحث الشامل عن ملف libMoltenVK.a ونسخه للمسار المطلوب
          mkdir -p /Users/runner/GeneralsX/MoltenVK/MoltenVK/MoltenVK/lib/MoltenVK.xcframework/ios-arm64
          find /Users/runner/GeneralsX -name "libMoltenVK.a" -exec cp {} /Users/runner/GeneralsX/MoltenVK/MoltenVK/MoltenVK/lib/MoltenVK.xcframework/ios-arm64/ \;
          
          cmake --preset ios-vulkan
          cmake --build build/ios-vulkan --target z_generals

      - name: Package IPA
        run: |
          GX_TEAM_ID="-" GX_BUNDLE_ID=com.github.generalszh ./scripts/build/ios/package-ios-zh.sh
          mkdir -p Payload
          find . -name "*.app" -exec cp -r {} Payload/ \;
          zip -r Generals.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Generals-IPA
          path: Generals.ipa
